name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Django checks & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Show generated migration when none is committed
        run: |
          if [ ! -f core/migrations/0001_initial.py ]; then
            python manage.py makemigrations core > makemig.log 2>&1 || true
            cat makemig.log core/migrations/0001_initial.py > mig.txt 2>&1 || true
            python .github/scripts/annotate.py mig.txt MIGRATION notice 40000
          fi

      - name: Django system check
        run: python manage.py check 2>&1 | tee check.log

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run -v 3 2>&1 | tee makemigrations.log

      - name: Tests
        run: python manage.py test -v 2 2>&1 | tee test.log; exit ${PIPESTATUS[0]}

      - name: Report failures
        if: failure()
        run: |
          python .github/scripts/annotate.py check.log CHECK error 6000
          python .github/scripts/annotate.py makemigrations.log MAKEMIGRATIONS error 8000
          python .github/scripts/annotate.py test.log TESTS error 30000

  browser:
    name: Browser smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt playwright && python -m playwright install --with-deps chromium
      - name: Start TableX
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
          python manage.py collectstatic --noinput > /dev/null
          DJANGO_DEBUG=false gunicorn tablex.wsgi -b 127.0.0.1:8000 -w 2 > server.log 2>&1 &
          sleep 3
      - name: Click through every screen
        run: python e2e/ui_smoke.py http://127.0.0.1:8000 2>&1 | tee e2e.log; exit ${PIPESTATUS[0]}
      - name: Report
        if: always()
        run: |
          if grep -q "E2E PASSED" e2e.log; then lvl=notice; else lvl=error; fi
          python .github/scripts/annotate.py e2e.log E2E $lvl 20000
          python .github/scripts/annotate.py server.log SERVER notice 8000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: e2e/shots/
